name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Integration checks with Curios
        run: |
          ./gradlew runSmokeServer --no-daemon
          grep -q '^PASS:' build/smoke-curios.txt

      - name: Integration checks without Curios
        run: |
          ./gradlew runSmokeServer -PwithoutCurios --no-daemon
          grep -q '^PASS:' build/smoke-no-curios.txt

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apotheosis-amulet-bag
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
